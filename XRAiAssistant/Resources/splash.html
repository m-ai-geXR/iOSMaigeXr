.splash.leaving{opacity:0;pointer-events:none}

.top,.bottom,.runtime-label{font:10px/1.6 ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase}
.top{display:flex;align-items:center;justify-content:space-between;color:#b9c8ff;border-top:1px solid #ffffff38;padding-top:12px}
.signal{display:flex;align-items:center;gap:8px}.signal:before{content:'';width:5px;height:5px;background:#8aa6ff}
.stage{position:absolute;inset:0 -12% 30%;z-index:-1;overflow:hidden;mix-blend-mode:screen;-webkit-mask-image:radial-gradient(ellipse closest-side,#000 45%,#000b 65%,transparent 98%);mask-image:radial-gradient(ellipse closest-side,#000 45%,#000b 65%,transparent 98%)}
#runtime{border:0;width:100%;height:100%;opacity:0;transition:opacity .6s;pointer-events:none}
.live #runtime{opacity:1}
.orbit{position:absolute;left:50%;top:47%;width:min(70vw,380px);aspect-ratio:1;transform:translate(-50%,-50%) rotate(-28deg);border:1px solid #4a74ea70;border-radius:50%;box-shadow:0 0 90px #2050e025,inset 0 0 90px #2050e015}
.orbit:after{content:'';position:absolute;inset:15%;border:1px solid #4a74ea40;border-radius:50%}
.live .orbit{opacity:0;transition:opacity .6s}
.identity{margin-top:auto;padding-top:110px;padding-bottom:34px;text-align:center}
.mascot{position:absolute;top:35%;left:50%;transform:translate(-50%,-50%);width:120px;height:120px;border-radius:50%;display:block;object-fit:cover;border:1px solid #8aa6ff66;box-shadow:0 0 0 8px #0b0d1277,0 0 50px #2050e080,0 12px 60px #0008}
.eyebrow{color:#8aa6ff;font:10px/1.5 ui-monospace,monospace;letter-spacing:.17em;text-transform:uppercase;margin:0 0 10px}
h1{font-family:Archivo,Arial,sans-serif;font-size:clamp(42px,12.8vw,88px);line-height:1.05;letter-spacing:-.055em;margin:0;white-space:nowrap;font-weight:800}
h1 span{color:#3f6bf0}.tagline{font-size:clamp(16px,4.5vw,24px);line-height:1.3;letter-spacing:-.025em;margin:14px 0 0;color:#d7d3d3}
.bottom{padding-top:14px;border-top:1px solid #ffffff38;display:flex;align-items:center;justify-content:space-between;gap:12px}
.credit{display:flex;flex-direction:column;gap:1px;color:#9b9797}.credit strong{font-family:Archivo,Arial,sans-serif;color:#f3f2f2;font-size:19px;letter-spacing:-.03em;text-transform:none}
.runtime-label{position:absolute;top:14%;left:0;right:0;text-align:center;color:#8aa6ff;font-size:9px}
@media(min-width:700px){.identity{text-align:left;padding-bottom:40px}.mascot{left:70%;top:43%;width:140px;height:140px}.stage{inset:-14% -8% 14% 30%}.runtime-label{top:18%;left:40%}}
@media(max-height:540px){.splash{padding-top:16px;padding-bottom:16px}.identity{text-align:left;padding-top:20px;padding-bottom:16px}.mascot{top:40%;left:73%;width:84px;height:84px}h1{font-size:44px}.tagline{margin-top:8px}.runtime-label{display:none}.stage{inset:-15% -5% 0 35%}}
@media(prefers-reduced-motion:no-preference){.identity{animation:arrive .65s ease-out both}@keyframes arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}}
</style>
